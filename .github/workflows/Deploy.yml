name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write   # lets the job ask GitHub for a login token (OIDC)
  contents: read
  packages: write   # lets the job push the image to GitHub Container Registry

# Never run two deploys at the same time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Decides which parts need a deploy, so a frontend-only change does not restart the API.
  changes:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          api=true
          frontend=true
          # On a push we can compare with the previous commit. In any other case
          # (manual run, first push, history not found) we deploy everything.
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            echo "Changed files:"
            echo "$changed"
            api=false
            frontend=false
            if echo "$changed" | grep -Eq '^(api/|mocks/|pyproject\.toml$|uv\.lock$|\.dockerignore$|\.github/workflows/Deploy\.yml$)'; then api=true; fi
            if echo "$changed" | grep -Eq '^(frontend/|\.github/workflows/Deploy\.yml$)'; then frontend=true; fi
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  deploy-api:
    # Only main may deploy. main always goes to the prod Environment.
    needs: changes
    if: github.ref_name == 'main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Docker image names must be lowercase, but repo names may have capitals.
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Safety net: build the image and start it on the build machine BEFORE
      # anything is pushed or deployed. A broken import or a missing package
      # shows up here, not on your live app.
      - name: Build image for the start-up test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          load: true
          tags: startup-test:latest

      - name: Check every module in the image can be imported
        run: |
          docker run --rm --entrypoint python \
            -e AUTH_MODE=token \
            -e AZURE_AD_TENANTID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_AD_CLIENTID=00000000-0000-0000-0000-000000000001 \
            -e AUTH_ACCEPT_ACCESS_TOKEN=false \
            -e AUTH_ACCEPT_ID_TOKEN=true \
            -e USER_ID_HMAC_KEY=startup-test-key-startup-test-key-0000 \
            startup-test:latest \
            -c 'import aiohttp, azure.identity.aio, importlib, pathlib; [importlib.import_module(".".join(p.with_suffix("").parts)) for p in sorted(pathlib.Path("api").rglob("*.py")) if p.name != "__init__.py"]'    

      - name: Start the image and check it answers
        run: |
          set -euo pipefail
          # Fake values: this container is thrown away. AUTH_MODE=token so the
          # login check is really switched on.
          docker run -d --name startup-test -p 8000:8000 \
            -e AUTH_MODE=token \
            -e AZURE_AD_TENANTID=00000000-0000-0000-0000-000000000000 \
            -e AZURE_AD_CLIENTID=00000000-0000-0000-0000-000000000001 \
            -e AUTH_ACCEPT_ACCESS_TOKEN=false \
            -e AUTH_ACCEPT_ID_TOKEN=true \
            -e USER_ID_HMAC_KEY=startup-test-key-startup-test-key-0000 \
            startup-test:latest
          ok=false
          for i in $(seq 1 20); do
            if curl --fail --silent "http://localhost:8000/health" > /dev/null; then ok=true; break; fi
            sleep 3
          done
          if [ "$ok" != "true" ]; then
            echo "The image did not start. Container log:"
            docker logs startup-test
            exit 1
          fi
          # A protected route must refuse a call with no token.
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8000/trips")"
          if [ "$code" != "401" ]; then
            echo "Expected 401 without a token but got $code"
            docker logs startup-test
            exit 1
          fi
          docker rm -f startup-test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      # Passwordless login to Azure with the managed identity (OIDC).
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Copies GitHub secrets and variables into the web app's own settings
      - name: Set app settings on the web app
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          # Login and user IDs
          AUTH_MODE: ${{ secrets.AUTH_MODE || vars.AUTH_MODE }}
          AUTH_ACCEPT_ACCESS_TOKEN: ${{ secrets.AUTH_ACCEPT_ACCESS_TOKEN || vars.AUTH_ACCEPT_ACCESS_TOKEN }}
          AUTH_ACCEPT_ID_TOKEN: ${{ secrets.AUTH_ACCEPT_ID_TOKEN || vars.AUTH_ACCEPT_ID_TOKEN }}
          AUTH_REQUIRED_SCOPE: ${{ secrets.AUTH_REQUIRED_SCOPE || vars.AUTH_REQUIRED_SCOPE }}
          AUTH_API_AUDIENCE: ${{ secrets.AUTH_API_AUDIENCE || vars.AUTH_API_AUDIENCE }}
          USER_ID_HMAC_KEY: ${{ secrets.USER_ID_HMAC_KEY }}
          AZURE_AD_TENANTID: ${{ secrets.AZURE_AD_TENANTID }}
          AZURE_AD_CLIENTID: ${{ secrets.AZURE_AD_CLIENTID }}
          # Cosmos DB
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          COSMOS_DATABASE: ${{ secrets.COSMOS_DATABASE || vars.COSMOS_DATABASE }}
          COSMOS_CONTAINER_TRIPS: ${{ secrets.COSMOS_CONTAINER_TRIPS || vars.COSMOS_CONTAINER_TRIPS }}
          # Place search (OpenStreetMap needs a contact in its User-Agent)
          GEOCODER_CONTACT: ${{ secrets.GEOCODER_CONTACT }}
          # Taxi providers (the mocks run inside this same app)
          BOLT_CLIENT_ID: ${{ secrets.BOLT_CLIENT_ID || vars.BOLT_CLIENT_ID }}
          BOLT_CLIENT_SECRET: ${{ secrets.BOLT_CLIENT_SECRET || vars.BOLT_CLIENT_SECRET }}
          UBER_SERVER_TOKEN: ${{ secrets.UBER_SERVER_TOKEN || vars.UBER_SERVER_TOKEN }}
          ECABS_API_KEY: ${{ secrets.ECABS_API_KEY || vars.ECABS_API_KEY }}
          BOLT_BASE_URL: ${{ vars.BOLT_BASE_URL }}
          UBER_BASE_URL: ${{ vars.UBER_BASE_URL }}
          ECABS_BASE_URL: ${{ vars.ECABS_BASE_URL }}
          ADAPTERS_ENABLED: ${{ vars.ADAPTERS_ENABLED }}
          ADAPTER_TIMEOUT_S: ${{ vars.ADAPTER_TIMEOUT_S }}
          MOCK_ADMIN_KEY: ${{ secrets.MOCK_ADMIN_KEY }}
          MOCK_FAULT_TIMEOUT_S: ${{ vars.MOCK_FAULT_TIMEOUT_S }}
          # Chatbot (Foundry agent). Plain values, not secrets.
          FOUNDRY_AGENT_RESPONSES_URL: ${{ vars.FOUNDRY_AGENT_RESPONSES_URL }}
          CHAT_DAILY_CAP: ${{ vars.CHAT_DAILY_CAP }}
          CHAT_TIMEOUT_S: ${{ vars.CHAT_TIMEOUT_S }}
          # AI explanations (optional: without them the plain template text is used)
          AI_ENABLED: ${{ secrets.AI_ENABLED || vars.AI_ENABLED }}
          AI_TIMEOUT_S: ${{ vars.AI_TIMEOUT_S }}
          AI_DAILY_CAP_FOUNDRY: ${{ vars.AI_DAILY_CAP_FOUNDRY }}
          AI_DAILY_CAP_GITHUB: ${{ vars.AI_DAILY_CAP_GITHUB }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_DEPLOYMENT_NAME: ${{ secrets.FOUNDRY_DEPLOYMENT_NAME || vars.FOUNDRY_DEPLOYMENT_NAME }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_MODELS_MODEL: ${{ secrets.GH_MODELS_MODEL || vars.GH_MODELS_MODEL }}
        run: |
          set -euo pipefail

          # 1. Stop BEFORE deploying if something the API needs to start is missing.
          missing=0
          for name in WEBAPP RESOURCE_GROUP CORS_ORIGIN USER_ID_HMAC_KEY AZURE_AD_TENANTID \
                      AZURE_AD_CLIENTID COSMOS_ENDPOINT COSMOS_DATABASE COSMOS_CONTAINER_TRIPS; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required value: $name"; missing=1; fi
          done
          if [ "${AUTH_MODE:-token}" != "token" ]; then
            echo "::error::AUTH_MODE must be token in production"; missing=1
          fi
          if [ "${AUTH_ACCEPT_ACCESS_TOKEN:-true}" != "false" ] && [ -z "${AUTH_REQUIRED_SCOPE:-}" ]; then
            echo "::error::AUTH_REQUIRED_SCOPE is needed unless AUTH_ACCEPT_ACCESS_TOKEN is false"; missing=1
          fi
          if [ -z "${COSMOS_KEY:-}" ]; then
            echo "::warning::COSMOS_KEY is empty: the API will try its managed identity for Cosmos"
          fi
          if [ -z "${GEOCODER_CONTACT:-}" ]; then
            echo "::warning::GEOCODER_CONTACT is empty: OpenStreetMap searches will carry no contact"
          fi
          for name in BOLT_CLIENT_ID BOLT_CLIENT_SECRET UBER_SERVER_TOKEN ECABS_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::$name is empty: that taxi provider will be switched off"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          # 2. Build the list of settings. Empty values are skipped.
          settings=()
          put() { if [ -n "$2" ]; then settings+=("$1=$2"); fi; }
          put CORS_ORIGIN "$CORS_ORIGIN"
          put AUTH_MODE "${AUTH_MODE:-token}"
          put AUTH_ACCEPT_ACCESS_TOKEN "${AUTH_ACCEPT_ACCESS_TOKEN:-}"
          put AUTH_ACCEPT_ID_TOKEN "${AUTH_ACCEPT_ID_TOKEN:-}"
          put AUTH_REQUIRED_SCOPE "${AUTH_REQUIRED_SCOPE:-}"
          put AUTH_API_AUDIENCE "${AUTH_API_AUDIENCE:-}"
          put USER_ID_HMAC_KEY "$USER_ID_HMAC_KEY"
          put AZURE_AD_TENANTID "$AZURE_AD_TENANTID"
          put AZURE_AD_CLIENTID "$AZURE_AD_CLIENTID"
          put COSMOS_ENDPOINT "$COSMOS_ENDPOINT"
          put COSMOS_KEY "${COSMOS_KEY:-}"
          put COSMOS_DATABASE "$COSMOS_DATABASE"
          put COSMOS_CONTAINER_TRIPS "$COSMOS_CONTAINER_TRIPS"
          put GEOCODER_CONTACT "${GEOCODER_CONTACT:-}"
          put FOUNDRY_AGENT_RESPONSES_URL "${FOUNDRY_AGENT_RESPONSES_URL:-}"
          put CHAT_DAILY_CAP "${CHAT_DAILY_CAP:-}"
          put CHAT_TIMEOUT_S "${CHAT_TIMEOUT_S:-}"
          # Taxi providers. The mocks live in this same app, so each MOCK_ value is a
          # copy of the matching API value.
          mocks_url="http://127.0.0.1:8000/mocks"
          put BOLT_CLIENT_ID "${BOLT_CLIENT_ID:-}"
          put BOLT_CLIENT_SECRET "${BOLT_CLIENT_SECRET:-}"
          put UBER_SERVER_TOKEN "${UBER_SERVER_TOKEN:-}"
          put ECABS_API_KEY "${ECABS_API_KEY:-}"
          put BOLT_BASE_URL "${BOLT_BASE_URL:-$mocks_url}"
          put UBER_BASE_URL "${UBER_BASE_URL:-$mocks_url}"
          put ECABS_BASE_URL "${ECABS_BASE_URL:-$mocks_url}"
          put ADAPTERS_ENABLED "${ADAPTERS_ENABLED:-}"
          put ADAPTER_TIMEOUT_S "${ADAPTER_TIMEOUT_S:-}"
          put MOCK_BOLT_CLIENT_ID "${BOLT_CLIENT_ID:-}"
          put MOCK_BOLT_CLIENT_SECRET "${BOLT_CLIENT_SECRET:-}"
          put MOCK_UBER_TOKEN "${UBER_SERVER_TOKEN:-}"
          put MOCK_ECABS_API_KEY "${ECABS_API_KEY:-}"
          put MOCK_ADMIN_KEY "${MOCK_ADMIN_KEY:-}"
          put MOCK_FAULT_TIMEOUT_S "${MOCK_FAULT_TIMEOUT_S:-}"
          put AI_ENABLED "${AI_ENABLED:-}"
          put AI_TIMEOUT_S "${AI_TIMEOUT_S:-}"
          put AI_DAILY_CAP_FOUNDRY "${AI_DAILY_CAP_FOUNDRY:-}"
          put AI_DAILY_CAP_GITHUB "${AI_DAILY_CAP_GITHUB:-}"
          put FOUNDRY_ENDPOINT "${FOUNDRY_ENDPOINT:-}"
          put FOUNDRY_API_KEY "${FOUNDRY_API_KEY:-}"
          put FOUNDRY_DEPLOYMENT_NAME "${FOUNDRY_DEPLOYMENT_NAME:-}"
          put GITHUB_MODELS_TOKEN "${GH_MODELS_TOKEN:-}"
          put GITHUB_MODELS_MODEL "${GH_MODELS_MODEL:-}"

          # 3. Save them. --output none stops az from printing every app setting in the log.
          az webapp config appsettings set \
            --name "$WEBAPP" \
            --resource-group "$RESOURCE_GROUP" \
            --settings "${settings[@]}" \
            --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}

            # The health check cannot pass while the app is stopped, so look at its state first.
      - name: Make sure the web app is running
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          state="$(az webapp show --name "$WEBAPP" --resource-group "$RESOURCE_GROUP" --query state --output tsv || echo unknown)"
          echo "Web app state: $state"
          if [ "$state" = "QuotaExceeded" ]; then
            echo "::error::The Free plan quota is used up. Starting will not help. Wait for the reset at midnight UTC."
            exit 1
          fi
          if [ "$state" = "Stopped" ]; then
            echo "The app was stopped, starting it."
            az webapp start --name "$WEBAPP" --resource-group "$RESOURCE_GROUP" --output none
          fi    

      # Red here means the API did not start. The app can take a few minutes.
      - name: Check the API is healthy
        id: health
        env:
          API_URL: ${{ vars.BACKEND_API_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 15 --retry-all-errors \
            "${API_URL}/health"

      # A crashing container restarts again and again and uses up the Free plan quota,
      # even overnight. If the API is not healthy after a deploy, stop the app.
      - name: Stop the app if it is not healthy
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az webapp stop --name "$WEBAPP" --resource-group "$RESOURCE_GROUP" --output none
          echo "::error::The API did not become healthy, so the web app was stopped to protect the quota. Fix the cause, then press Start."      

  deploy-frontend:
    # Runs after the API job when both run, and never ships a new frontend if the API deploy failed.
    needs: [changes, deploy-api]
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.changes.outputs.frontend == 'true' && needs.deploy-api.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Swaps the placeholders in auth-config.js for the real values.
      # Only the copy on this build machine changes, not your repo file.
      - name: Fill in site settings
        env:
          CLIENT_ID: ${{ secrets.AZURE_AD_CLIENTID }}
          TENANT_ID: ${{ secrets.AZURE_AD_TENANTID }}
          API_URL: ${{ vars.BACKEND_API_URL }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID"
          test -n "$TENANT_ID"
          test -n "$API_URL"
          FILE=frontend/javascript/auth-config.js
          sed -i \
            -e "s|PASTE_CLIENT_ID_HERE|${CLIENT_ID}|" \
            -e "s|PASTE_TENANT_ID_HERE|${TENANT_ID}|" \
            -e "s|PASTE_BACKEND_API_URL_HERE|${API_URL}|" \
            "$FILE"
          # The Geoapify key is optional: without it, suggestions while typing stay
          # off and the search still works when the user presses Enter.
          if [ -n "${GEOAPIFY_KEY:-}" ]; then
            sed -i -e "s|PASTE_GEOAPIFY_KEY_HERE|${GEOAPIFY_KEY}|" "$FILE"
          else
            echo "::warning::No GEOAPIFY_API_KEY secret: suggestions while typing are off"
          fi
          if grep -Eq "PASTE_(CLIENT_ID|TENANT_ID|BACKEND_API_URL)_HERE" "$FILE"; then
            echo "A placeholder was not replaced in $FILE"
            exit 1
          fi

      # The frontend is plain HTML, CSS and JavaScript, so there is no build step.
      - name: Upload frontend to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "frontend"
          skip_app_build: true
          skip_api_build: true