name: Deploy

# REMINDER
# Manual trigger only for now. To run it: Actions tab, Deploy, Run workflow,
# then pick the main branch. Any other branch is skipped.
#
# To turn on automatic deploys later, replace the "on:" block below with:
#   on:
#     workflow_dispatch:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job ask GitHub for a login token (OIDC)
  contents: read
  packages: write   # lets the job push the image to GitHub Container Registry

jobs:
  deploy-api:
    # Only main may deploy. main always goes to the prod Environment.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Docker image names must be lowercase, but repo names may have capitals.
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}

      # Passwordless login to Azure with the managed identity (OIDC).
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}

  deploy-frontend:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # The frontend is plain HTML, CSS and JavaScript, so there is no build step.
      - name: Upload frontend to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "frontend"
          skip_app_build: true
          skip_api_build: true