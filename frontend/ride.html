<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fabrikam | Get a ride</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body data-protected>

    <div id="siteHeader"></div>

    <main class="container rp-layout">
        <!-- LEFT: the request form -->
        <form id="rideForm" class="rp-card" novalidate>
            <h1 class="rp-title">
                <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
                    <path fill="currentColor"
                        d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h.5a1.5 1.5 0 0 1 1.5 1.5V17a1 1 0 0 1-1 1h-1v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-1H4a1 1 0 0 1-1-1v-4.5A1.5 1.5 0 0 1 4.5 11zM8.4 7l-1 3h9.2l-1-3zM6.5 13.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm11 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" />
                </svg>
                Get a ride
            </h1>

            <!-- Pickup -->
            <label class="rp-field">
                <svg class="rp-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor"
                        d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" />
                </svg>
                <input type="text" id="pickup" placeholder="Pickup location" aria-label="Pickup location"
                    autocomplete="off">
            </label>

            <!-- Dropoff with swap button -->
            <label class="rp-field">
                <svg class="rp-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" />
                </svg>
                <input type="text" id="dropoff" placeholder="Dropoff location" aria-label="Dropoff location"
                    autocomplete="off">
                <button type="button" id="swapBtn" class="rp-icon-btn" aria-label="Swap pickup and dropoff">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </label>

            <!-- Passengers (a dropdown) -->
            <!-- ============================================================
     In ride.html, replace the old "Passengers" block and the old
     "Preferred provider" block with the two blocks below.
     Keep everything else (navbar, pickup, dropoff, belongings, Search).
     ============================================================ -->


            <!-- Passengers (now a number input, not a dropdown) -->
            <label class="rp-field">
                <svg class="rp-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" fill="currentColor" />
                    <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z" fill="currentColor" />
                </svg>
                <input type="number" id="passengers" min="1" step="1" inputmode="numeric"
                    placeholder="Number of passengers" aria-label="Number of passengers">
            </label>


            <!-- Preferred provider (a custom dropdown, the chosen one shows in the box) -->
            <div class="rp-field rp-select" id="providerSelect" data-open="false">
                <svg class="rp-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor"
                        d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" />
                </svg>

                <button type="button" class="rp-select-btn" id="providerBtn" role="combobox" aria-haspopup="listbox"
                    aria-expanded="false" aria-controls="providerList" aria-label="Preferred provider">
                    <span id="providerLabel">Any provider</span>
                </button>

                <svg class="rp-chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" d="M6 9l6 6 6-6" />
                </svg>

                <ul class="rp-options" id="providerList" role="listbox" aria-label="Preferred provider" hidden>
                    <li role="option" id="provider-any" data-value="any" aria-selected="true">Any provider</li>
                    <li role="option" id="provider-swift-rides" data-value="swift-rides" aria-selected="false">Swift
                        Rides</li>
                    <li role="option" id="provider-citygo" data-value="citygo" aria-selected="false">CityGo</li>
                    <li role="option" id="provider-metro-cabs" data-value="metro-cabs" aria-selected="false">Metro Cabs
                    </li>
                </ul>

                <!-- holds the chosen value so ride-page.js can read it -->
                <input type="hidden" id="provider" value="any">
            </div>

            <!-- Belongings (a text input) -->
            <label class="rp-field">
                <svg class="rp-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor"
                        d="M9 3h6a1 1 0 0 1 1 1v2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2V4a1 1 0 0 1 1-1zm1 3h4V5h-4z" />
                </svg>
                <input type="text" id="belongings" placeholder="Belongings (for example, 2 suitcases)"
                    aria-label="Belongings" autocomplete="off" maxlength="120">
            </label>

            <button type="submit" class="btn btn-primary rp-search">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5" />
                    <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                </svg>
                Find a ride
            </button>
            <p id="formMsg" class="form-msg" role="status" aria-live="polite"></p>
        </form>

        <!-- RIGHT: the map area. The backend will fill this later. -->
        <section id="rideMap" class="rp-map" aria-label="Map"></section>
    </main>


    <script src="javascript/header.js"></script>
    <script src="javascript/mobile-menu.js"></script>
    <script src="javascript/vendor/msal-browser.min.js"></script>
    <script src="javascript/auth-config.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/navbar.js"></script>
    <script src="javascript/preview-menu.js"></script>
    <script src="javascript/ride-page.js"></script>
</body>

</html>
