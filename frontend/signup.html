<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Sign up | Fabrikam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-main">
        <section class="auth-card">
            <a href="index.html" class="auth-logo">
                <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" />
                </svg>
                Fabrikam
            </a>

            <h1 class="auth-title">Create your account</h1>
            <p class="auth-sub">Sign up to book rides and keep track of your trips.</p>

            <button type="button" id="authBtn" class="btn btn-primary btn-block" data-mode="signup">Continue to Secure
                Sign Up</button>
            <p id="authMsg" class="auth-msg" role="alert"></p>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <footer class="auth-footer">
        <div class="container auth-footer-inner">
            <span>&copy; 2026 Fabrikam. All rights reserved.</span>
            <nav aria-label="Legal">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </nav>
        </div>
    </footer>

    <script src="javascript/vendor/msal-browser.min.js"></script>
    <script src="javascript/auth-config.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/auth-page.js"></script>
</body>

</html>
