<!-- ============================================================
  RIDE POPUPS: the three popup states in one file.
  Real data is filled in by javascript/ride-popups.js. Nothing here is sample data.

  How to use it in ride.html:
  1. Put the <link> tag below inside <head>.
  2. Copy everything from "POPUP START" to "POPUP END" into <body>, just before </body>.
  3. Put the <script type="module"> tag after your other scripts.
============================================================= -->

<link rel="stylesheet" href="css/ride-popups.css">

<!-- ===== POPUP START ===== -->
<div class="rp-overlay" id="rp-overlay" hidden>
    <div class="rp-dialog" id="rp-dialog" role="dialog" aria-modal="true" aria-labelledby="rp-title-results"
        tabindex="-1">

        <!-- STATE 1: your ride options -->
        <section class="rp-step" id="rp-step-results">
            <header class="rp-head">
                <span class="rp-head-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 6v4H3z" />
                        <circle cx="7.5" cy="14.5" r="1" />
                        <circle cx="16.5" cy="14.5" r="1" />
                    </svg>
                </span>
                <h2 id="rp-title-results" tabindex="-1">Your ride options</h2>
                <button type="button" class="rp-cancel" data-rp-close>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                    <span>Cancel</span>
                </button>
            </header>
            <div class="rp-body">
                <dl class="rp-details rp-trip" id="rp-trip"></dl>
                <div id="rp-status"></div>
                <div id="rp-banners"></div>
                <div id="rp-recommended"></div>
                <div class="rp-explain" id="rp-explain" hidden>
                    <h3>Why we recommend this <span class="rp-pill rp-ai" id="rp-explain-ai" hidden>AI-generated</span>
                    </h3>
                    <p id="rp-explain-text"></p>
                </div>
                <h3 class="rp-section-title" id="rp-others-title" hidden>Other options</h3>
                <div id="rp-others"></div>
                <div class="rp-center"><button type="button" class="rp-link" id="rp-more-toggle" aria-expanded="false"
                        hidden>See all options</button></div>
                <div id="rp-more" hidden></div>
                <p class="rp-foot">Prices are simulated. Nothing is charged and no driver is sent.<br>&copy;
                    OpenStreetMap contributors</p>
            </div>
        </section>

        <!-- STATE 2: confirm your booking -->
        <section class="rp-step" id="rp-step-confirm" hidden>
            <header class="rp-head">
                <span class="rp-head-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="16" rx="3" />
                        <path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4" />
                    </svg>
                </span>
                <h2 id="rp-title-confirm" tabindex="-1">Confirm your booking</h2>
                <button type="button" class="rp-cancel" data-rp-close>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                    <span>Cancel</span>
                </button>
            </header>
            <div class="rp-body">
                <dl class="rp-details rp-trip" id="rp-confirm-details"></dl>
                <span class="rp-label" id="rp-pay-label">Payment</span>
                <div role="radiogroup" aria-labelledby="rp-pay-label">
                    <label class="rp-radio"><input type="radio" name="rp-pay" value="CARD_SIMULATED" checked><span
                            class="rp-dot"></span><span>Card (simulated)</span></label>
                    <label class="rp-radio"><input type="radio" name="rp-pay" value="CASH"><span
                            class="rp-dot"></span><span>Cash</span></label>
                </div>
                <label class="rp-check">
                    <input type="checkbox" id="rp-confirm-check">
                    <span class="rp-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 13l4 4L19 7" />
                        </svg></span>
                    <span>I confirm this booking</span>
                </label>
                <div id="rp-confirm-error" role="alert"></div>
            </div>
            <footer class="rp-footer">
                <div class="rp-actions">
                    <button type="button" class="rp-btn" id="rp-back">Back to options</button>
                    <button type="button" class="rp-btn rp-primary" id="rp-confirm" disabled>Confirm booking</button>
                </div>
            </footer>
        </section>

        <!-- STATE 3: booking confirmed -->
        <section class="rp-step" id="rp-step-done" hidden>
            <header class="rp-head">
                <span style="flex:1"></span>
                <button type="button" class="rp-cancel" data-rp-close>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                    <span>Close</span>
                </button>
            </header>
            <div class="rp-body">
                <div class="rp-done-top">
                    <svg class="rp-checkmark" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="50" cy="50" r="40"></circle>
                        <path d="M32 52 L45 65 L69 38"></path>
                    </svg>
                    <h2 id="rp-title-done" tabindex="-1">Booking confirmed</h2>
                </div>
                <dl class="rp-details rp-trip" id="rp-done-details"></dl>
                <p class="rp-sim-note" id="rp-done-note">Simulated. Nothing was charged.</p>
            </div>
            <footer class="rp-footer">
                <div class="rp-actions">
                    <button type="button" class="rp-btn" id="rp-view-trips">View my trips</button>
                    <button type="button" class="rp-btn rp-primary" data-rp-close>Close</button>
                </div>
            </footer>
        </section>

    </div>
</div>
<!-- ===== POPUP END ===== -->

<!-- Put this after your other scripts. It needs the API client placeholder fixed first (see the top of ride-popups.js). -->
<script type="module" src="javascript/ride-popups.js"></script>
